  <radialGradient id="glow"><stop stop-color="#44DDCB" stop-opacity=".19"/><stop offset="1" stop-color="#44DDCB" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4E3F5" stroke-opacity=".045"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
