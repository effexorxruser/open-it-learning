<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Open IT Learning — the evidence-first learning graph</title>
<desc id="desc">Dark editorial banner with connected learning nodes, a glowing turquoise and violet graph, and Open IT Learning wordmark.</desc>
<defs>
