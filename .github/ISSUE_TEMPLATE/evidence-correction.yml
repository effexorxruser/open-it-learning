name: "Fix a catalog claim"
description: "Report an unsupported certificate claim, fee, requirement, or stale official link."
title: "[Correction] "
body:
  - type: input
    id: record
    attributes:
      label: Affected course or repository file
      description: "Link directly to the affected page or record."
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Issue type
      options:
        - Certificate unavailable or conditions changed
        - Certificate fee or exam fee changed
        - Course content no longer free
        - Badge incorrectly described as certificate
        - Official course URL stale or broken
        - Unsupported claim or conflicting official sources
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official evidence and date checked
      description: "Include short quoted text and exact links."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed correction
      description: "Explain what should change and what remains uncertain."
    validations:
      required: true
