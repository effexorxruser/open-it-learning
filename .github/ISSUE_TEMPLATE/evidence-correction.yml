name: "Correct an official course claim"
description: "Report changed course access, reward conditions, expired vouchers, or unsupported catalog claims."
title: "[Correction] "
body:
  - type: input
    id: record
    attributes:
      label: Affected course, issue or repository file
      description: "Link to the specific record or official course."
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What changed?
      options:
        - Certificate or professional credential conditions changed
        - Digital badge no longer available or misclassified
        - Diploma / award / participation recognition incorrectly described
        - Exam voucher, credits or lab bonus unavailable or expired
        - Course content is no longer free
        - Separate outcome or exam fee changed
        - Official URL stale / broken
        - Unsupported statement or contradictory official sources
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official evidence, short quote and UTC check date
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested correction and remaining uncertainty
    validations:
      required: true
