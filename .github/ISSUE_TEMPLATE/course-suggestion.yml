name: "Suggest a verified course"
description: "Propose a free IT course with official evidence of an obtainable certificate."
title: "[Course] "
body:
  - type: markdown
    attributes:
      value: |
        Open IT Learning publishes only **free IT courses with officially confirmed certificates**.
        A badge or an unverified certificate claim is not enough. Missing evidence means the suggestion remains under review.
  - type: input
    id: provider
    attributes:
      label: Official course provider
      placeholder: "Provider name"
    validations:
      required: true
  - type: input
    id: course
    attributes:
      label: Exact course title
    validations:
      required: true
  - type: input
    id: course_url
    attributes:
      label: Direct official course URL
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: free_evidence
    attributes:
      label: Evidence that learning is free
      description: "Official link and short quote confirming full course access, not a trial."
    validations:
      required: true
  - type: input
    id: credential_url
    attributes:
      label: Official URL proving a certificate is obtainable for this course
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: credential_requirements
    attributes:
      label: Certificate requirements and fees
      description: "Quote the official conditions. Separate course price, certificate price and any exam fee."
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Region, language and unresolved questions
      description: "What is uncertain? Include the date you checked the official pages."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Submission checks
      options:
        - label: "All cited URLs are official; this is a candidate for review, not a pre-approved catalog record."
          required: true
        - label: "I have not included credentials, private data or copyrighted course content."
          required: true
