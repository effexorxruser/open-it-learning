name: "Suggest a free course with an official outcome"
description: "Propose a free IT course with an officially documented badge, certificate, diploma, award or other benefit."
title: "[Course] "
body:
  - type: markdown
    attributes:
      value: |
        Open IT Learning accepts **free IT courses with documented, obtainable official outcomes** — including badges, certificates, diplomas, awards, records and course-linked benefits.

        A generic "Achievements" section is not sufficient on its own; please share the issuer's actual conditions.
  - type: input
    id: provider
    attributes:
      label: Course provider / issuer
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Exact course title
    validations:
      required: true
  - type: input
    id: course_url
    attributes:
      label: Direct official course URL
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: free_evidence
    attributes:
      label: Proof that training content is free
      description: "Provide the provider's official page and a short relevant excerpt."
    validations:
      required: true
  - type: dropdown
    id: outcome_type
    attributes:
      label: What official result can be obtained?
      options:
        - Completion certificate
        - Professional certificate or credential
        - Digital badge
        - Diploma
        - Award / commendation / certificate of merit
        - Official participation or completion record
        - Exam voucher or discount
        - Learning credit / lab access
        - Other provider-issued recognition or benefit
    validations:
      required: true
  - type: input
    id: outcome_source
    attributes:
      label: Official source confirming the specific outcome
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: eligibility
    attributes:
      label: How to obtain it and what does it cost?
      description: "Quote the official conditions, including region, eligibility and any separate issuance/exam fee."
    validations:
      required: true
  - type: textarea
    id: caveats
    attributes:
      label: Unknowns and date checked (UTC)
      description: "What is still ambiguous or unconfirmed?"
    validations:
      required: true
  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Checklist
      options:
        - label: "I understand this is a candidate awaiting review, not an automatically verified catalog entry."
          required: true
        - label: "I have not included credentials, private user data or substantial copyrighted course material."
          required: true
