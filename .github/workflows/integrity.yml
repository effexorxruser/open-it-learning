name: Repository integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    name: Markdown links, catalog schema and banner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate public repository content
        run: python3 scripts/check_integrity.py

      - name: Set up Python for schema tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install schema test dependencies
        run: python3 -m pip install 'jsonschema==4.26.0' 'rfc3339-validator==0.1.4'

      - name: Test free and paid record contracts
        run: python3 -m unittest discover -s tests -v
